name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab or `gh workflow run CI`.
  workflow_dispatch:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The runner image is pinned like the toolchain and the actions: a new
# image arrives in a commit of its own, not under a run.
jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-26.04
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag, so a moved
      # tag cannot re-point CI at different code. Renovate keeps the SHAs
      # current.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # rustup is preinstalled on the runner. `rustup toolchain install`
      # with no argument installs the active toolchain, the one
      # rust-toolchain.toml names, with its components, so CI and every
      # developer machine run the same compiler and the same clippy. It
      # installs regardless of rustup's auto-install setting; `rustup show`
      # installs only through auto-install, which rustup 1.28.0 removed and
      # a machine can turn off. It runs before the cache action, which keys
      # on the installed rustc.
      - name: install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: fmt + clippy
        run: dev/ci-checks.sh

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      # The disk tier's tests read cached chunk-file pages with RWF_NOWAIT,
      # which tmpfs and overlayfs refuse, so their temporary files go on the
      # runner's disk rather than wherever /tmp is mounted. The runner
      # context is available to steps only, so the variable is exported
      # here for the steps after this one.
      - name: temporary files on the runner's disk
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          findmnt --target /tmp
          findmnt --target "$RUNNER_TEMP"
      - name: cargo test
        run: cargo test --workspace --locked

  miri:
    name: miri
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # No toolchain step and no cache: dev/miri.sh installs its pinned
      # nightly with Miri and names it on every command, so nothing here
      # runs rust-toolchain.toml's stable pin, and Miri builds its own
      # sysroot on each run.
      - name: miri
        run: dev/miri.sh
