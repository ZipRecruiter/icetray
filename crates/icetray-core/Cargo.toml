[package]
name = "icetray-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everything from bytes to lookups: keys, storage, catalog, manifests, index, cache, generations, doctor, and configuration"

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-glue = { version = "1.174.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3tables = { version = "1.71.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
bytes = { workspace = true }
crc32c = { workspace = true }
crc32fast = { workspace = true }
flate2 = "1.1.10"
foyer = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true }
jiff = { workspace = true }
libc.workspace = true
metrics = { workspace = true }
murmur3 = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
pin-project-lite.workspace = true
prost = { workspace = true }
quick_cache = { workspace = true }
roaring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
arrow = { workspace = true }
metrics-util = { workspace = true, features = ["debugging"] }
rand = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
